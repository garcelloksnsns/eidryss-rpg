name: Build Eidryss APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-client/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate server and interface
        run: npm test

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle -p android-client --no-daemon clean assembleDebug

      - name: Rename debug APK
        run: cp android-client/app/build/outputs/apk/debug/app-debug.apk Eidryss-Android-debug.apk

      - name: Prepare stable release signing
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/eidryss-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eidryss-signing/eidryss-release.jks"

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          EIDRYSS_KEYSTORE_FILE: ${{ runner.temp }}/eidryss-signing/eidryss-release.jks
          EIDRYSS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EIDRYSS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EIDRYSS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android-client --no-daemon assembleRelease
          cp android-client/app/build/outputs/apk/release/app-release.apk Eidryss-Android-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Eidryss-Android-APK-debug
          path: Eidryss-Android-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Eidryss-Android-APK-release
          path: Eidryss-Android-release.apk
          if-no-files-found: error
          retention-days: 90
